name: Etonify · Android arm64 builds

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to sign and create or update as a draft; leave blank for an artifact-only build.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  JAVA_VERSION: "21"

jobs:
  build-arm64-apk:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag == '' && github.ref != 'refs/heads/feat/diagnostic-runtime-logging')
    name: Build arm64 APK artifact
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned libbox binary
        run: |
          git submodule update --init --depth 1 -- etonify-core
          python3 scripts/verify_libbox.py

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies and generate bindings
        run: |
          flutter pub get
          flutter gen-l10n
          dart run pigeon --input pigeons/singbox_api.dart

      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Build arm64 Release APK
        shell: bash
        env:
          MEOW_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define=ETONIFY_RUNTIME_DIAGNOSTICS=false
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          output="etonify-arm64-v8a-${GITHUB_SHA::7}.apk"
          mkdir -p build/release-apk
          cp "$apk" "build/release-apk/${output}"
          ls -lah build/release-apk/*.apk

      - name: Upload arm64 APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etonify-android-arm64-${{ github.sha }}
          path: build/release-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  draft-tag-release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.release_tag != '') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/v0.3.101' && inputs.release_tag == 'v0.3.101') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/v0.3.106' && inputs.release_tag == 'v0.3.106')
    name: Build signed tag APK and create draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate version tag
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${RELEASE_TAG_INPUT}"
          fi
          version="${release_tag#v}"
          if ! [[ "$release_tag" =~ ^v[0-9]+(\.[0-9]+){1,3}([._-][0-9A-Za-z]+)*$ ]]; then
            echo "::error title=Invalid version tag::Use an existing tag such as v0.3.9."
            exit 1
          fi
          pubspec_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' pubspec.yaml | head -n1)"
          python3 - "$release_tag" "$pubspec_version" <<'PY'
          import re
          import subprocess
          import sys

          release_tag, pubspec_version = sys.argv[1:]
          current_match = re.fullmatch(r"(\d+(?:\.\d+){1,3})\+(\d+)", pubspec_version)
          tag_match = re.fullmatch(r"v(\d+(?:\.\d+){1,3})(?:[._-][0-9A-Za-z]+)*", release_tag)
          if current_match is None or tag_match is None:
              raise SystemExit("::error title=Invalid version source::pubspec.yaml must contain a numeric version and build number, and release tags must use numeric versions.")

          current_name = current_match.group(1)
          current_build = int(current_match.group(2))
          if tag_match.group(1) != current_name:
              raise SystemExit(f"::error title=Version mismatch::Tag {release_tag} does not match pubspec.yaml version {current_name}.")

          current_tuple = tuple(int(part) for part in current_name.split("."))
          candidates = []
          for name in subprocess.check_output(["git", "tag", "--merged", "HEAD"], text=True).splitlines():
              match = re.fullmatch(r"v(\d+(?:\.\d+){1,3})(?:[._-][0-9A-Za-z]+)*", name)
              if match is None:
                  continue
              parts = tuple(int(part) for part in match.group(1).split("."))
              if parts < current_tuple:
                  candidates.append((parts, name))
          if not candidates:
              raise SystemExit("::error title=Previous version missing::No earlier version tag is reachable from this commit.")

          previous_tag = max(candidates)[1]
          previous_yaml = subprocess.check_output(["git", "show", f"{previous_tag}:pubspec.yaml"], text=True)
          previous_match = re.search(r"^version:\s*(\d+(?:\.\d+){1,3})\+(\d+)\s*$", previous_yaml, re.MULTILINE)
          if previous_match is None:
              raise SystemExit(f"::error title=Previous version invalid::{previous_tag} has no numeric pubspec build number.")
          previous_build = int(previous_match.group(2))
          if current_build <= previous_build:
              raise SystemExit(f"::error title=Build number not increased::pubspec.yaml build number {current_build} must be greater than {previous_tag} build number {previous_build}.")
          print(f"Version source verified: {release_tag}, pubspec build number {current_build} > {previous_tag} build number {previous_build}.")
          PY
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Verify tag target matches checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          tag_target_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$checked_out_sha" != "$tag_target_sha" ]; then
            echo "::error title=Tag checkout mismatch::Checked out ${checked_out_sha}, but ${RELEASE_TAG} points to ${tag_target_sha}. Refusing to build."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error title=Tag event SHA mismatch::Workflow event SHA ${GITHUB_SHA} differs from checked-out commit ${checked_out_sha}. Refusing to build."
            exit 1
          fi
          echo "Verified ${RELEASE_TAG} target and checked-out commit: ${checked_out_sha}"

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Signing secret required::${name} is not configured. Add the repository Secret with this exact name, as documented in docs/github-actions.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore long-term Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/etonify-release.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app/etonify-release.jks
          EOF
          chmod 600 android/app/etonify-release.jks android/key.properties

      - name: Verify pinned libbox binary
        run: |
          git submodule update --init --depth 1 -- etonify-core
          python3 scripts/verify_libbox.py

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies and generate bindings
        run: |
          flutter pub get
          flutter gen-l10n
          dart run pigeon --input pigeons/singbox_api.dart

      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Check formatting before signed build
        shell: bash
        run: |
          set -euo pipefail
          git ls-files 'lib/*.dart' 'test/*.dart' \
            | grep -v '\.g\.dart$' \
            | xargs -n 50 dart format --output=none --set-exit-if-changed

      - name: Checkout pinned APK verifier reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 841f6a63b3398aff50ef502cab93efd91a78406b
          path: verifier-fix

      - name: Verify tag contains the repaired APK verifier
        run: cmp scripts/verify_android_release_apk.sh verifier-fix/scripts/verify_android_release_apk.sh

      - name: Test APK verifier from tag source
        run: bash scripts/verify_android_release_apk_test.sh

      - name: Build signed arm64 Release APK
        shell: bash
        env:
          MEOW_ALLOW_DEBUG_RELEASE_SIGNING: "false"
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define=ETONIFY_RUNTIME_DIAGNOSTICS=false
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          output="etonify-v${RELEASE_VERSION}-arm64-v8a.apk"
          mkdir -p build/release-apk
          cp "$apk" "build/release-apk/${output}"
          ls -lah build/release-apk/*.apk

      - name: Verify signed APK package, version and certificate before draft
        shell: bash
        env:
          MINIMUM_UPGRADE_VERSION_CODE: "6055"
          EXPECTED_RELEASE_CERT_SHA256: "f1e431ddbefe3496db75f264a0dd02472c7a4be704f8f78c7bd834c146f9f665"
        run: |
          set -euo pipefail
          version_values="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)[[:space:]]*$/\1 \2/p' pubspec.yaml | head -n1)"
          if [[ -z "$version_values" ]]; then
            echo "::error title=Invalid version source::Could not read a numeric version and build number from pubspec.yaml."
            exit 1
          fi
          read -r pubspec_version pubspec_build_number <<< "$version_values"
          if [[ "$pubspec_version" != "$RELEASE_VERSION" ]]; then
            echo "::error title=Version mismatch::APK source version $pubspec_version does not match tag version $RELEASE_VERSION."
            exit 1
          fi
          scripts/verify_android_release_apk.sh \
            "build/release-apk/etonify-v${RELEASE_VERSION}-arm64-v8a.apk" \
            "$pubspec_version" "$pubspec_build_number" \
            "$MINIMUM_UPGRADE_VERSION_CODE" "$EXPECTED_RELEASE_CERT_SHA256"

      - name: Create or update draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes_file="build/release-notes.md"
          source_sha="$(git rev-parse HEAD)"
          cat > "$notes_file" <<EOF
          Signed Android arm64 APK built from ${source_sha}.
          This Release is a draft and has not been published.
          EOF
          if gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft >/tmp/release-draft-state.txt 2>/dev/null; then
            if [[ "$(cat /tmp/release-draft-state.txt)" != "true" ]]; then
              echo "::error title=Published release protected::Refusing to modify a non-draft release."
              exit 1
            fi
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes-file "$notes_file" --draft
            gh release upload "${RELEASE_TAG}" build/release-apk/*.apk --clobber
          else
            gh release create "${RELEASE_TAG}" build/release-apk/*.apk \
              --verify-tag \
              --draft \
              --title "${RELEASE_TAG}" \
              --notes-file "$notes_file"
          fi
  diagnostic-test-artifact:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feat/diagnostic-runtime-logging' &&
      inputs.release_tag == ''
    name: Build signed diagnostics test APK artifact only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned libbox binary
        run: |
          git submodule update --init --depth 1 -- etonify-core
          python3 scripts/verify_libbox.py

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies and generate bindings
        run: |
          flutter pub get
          flutter gen-l10n
          dart run pigeon --input pigeons/singbox_api.dart

      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test
          flutter test --dart-define=ETONIFY_RUNTIME_DIAGNOSTICS=true \
            test/runtime_diagnostic_log_test.dart test/settings_page_test.dart

      - name: Verify test build version source
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' pubspec.yaml | head -n1)"
          if [[ "$version" != "0.3.103+4052" ]]; then
            echo "::error title=Unexpected test build version::Expected 0.3.103+4052; found ${version:-<missing>}."
            exit 1
          fi

      - name: Restore existing Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Signing secret required::${name} is not configured."
              exit 1
            fi
          done
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/etonify-release.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app/etonify-release.jks
          EOF
          chmod 600 android/app/etonify-release.jks android/key.properties

      - name: Build signed arm64 diagnostic test APK
        shell: bash
        env:
          MEOW_ALLOW_DEBUG_RELEASE_SIGNING: "false"
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --dart-define=ETONIFY_RUNTIME_DIAGNOSTICS=true
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          output="etonify-runtime-diagnostics-v0.3.103-arm64-v8a-6052.apk"
          mkdir -p build/release-apk
          cp "$apk" "build/release-apk/${output}"
          ls -lah "build/release-apk/${output}"

      - name: Verify package, upgrade version and release certificate
        shell: bash
        env:
          MINIMUM_UPGRADE_VERSION_CODE: "6051"
          EXPECTED_RELEASE_CERT_SHA256: "f1e431ddbefe3496db75f264a0dd02472c7a4be704f8f78c7bd834c146f9f665"
        run: |
          set -euo pipefail
          scripts/verify_android_release_apk.sh \
            build/release-apk/etonify-runtime-diagnostics-v0.3.103-arm64-v8a-6052.apk \
            0.3.103 4052 "$MINIMUM_UPGRADE_VERSION_CODE" "$EXPECTED_RELEASE_CERT_SHA256"

      - name: Remove temporary signing files
        if: always()
        run: rm -f android/app/etonify-release.jks android/key.properties

      - name: Upload diagnostics APK artifact only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etonify-runtime-diagnostics-arm64-6052-${{ github.sha }}
          path: build/release-apk/etonify-runtime-diagnostics-v0.3.103-arm64-v8a-6052.apk
          if-no-files-found: error
          retention-days: 14
