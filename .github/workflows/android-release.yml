name: Etonify · Android arm64 builds

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to sign and create or update as a draft; leave blank for an artifact-only build.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  JAVA_VERSION: "21"

jobs:
  build-arm64-apk:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')
    name: Build arm64 APK artifact
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned libbox binary
        run: |
          git submodule update --init --depth 1 -- etonify-core
          python3 scripts/verify_libbox.py

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies and generate bindings
        run: |
          flutter pub get
          flutter gen-l10n
          dart run pigeon --input pigeons/singbox_api.dart

      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Build arm64 Release APK
        shell: bash
        env:
          MEOW_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          output="etonify-arm64-v8a-${GITHUB_SHA::7}.apk"
          mkdir -p build/release-apk
          cp "$apk" "build/release-apk/${output}"
          ls -lah build/release-apk/*.apk

      - name: Upload arm64 APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etonify-android-arm64-${{ github.sha }}
          path: build/release-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  draft-tag-release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.release_tag != '')
    name: Build signed tag APK and create draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate version tag
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${RELEASE_TAG_INPUT}"
          fi
          version="${release_tag#v}"
          if ! [[ "$release_tag" =~ ^v[0-9]+(\.[0-9]+){1,3}([._-][0-9A-Za-z]+)*$ ]]; then
            echo "::error title=Invalid version tag::Use an existing tag such as v0.3.9."
            exit 1
          fi
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Signing secret required::${name} is not configured. Add the repository Secret with this exact name, as documented in docs/github-actions.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore long-term Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/etonify-release.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app/etonify-release.jks
          EOF
          chmod 600 android/app/etonify-release.jks android/key.properties

      - name: Verify pinned libbox binary
        run: |
          git submodule update --init --depth 1 -- etonify-core
          python3 scripts/verify_libbox.py

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies and generate bindings
        run: |
          flutter pub get
          flutter gen-l10n
          dart run pigeon --input pigeons/singbox_api.dart

      - name: Analyze and test
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Build signed arm64 Release APK
        shell: bash
        env:
          MEOW_ALLOW_DEBUG_RELEASE_SIGNING: "false"
        run: |
          set -euo pipefail
          flutter build apk --release --build-name "${RELEASE_VERSION}" --target-platform android-arm64 --split-per-abi
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          output="etonify-v${RELEASE_VERSION}-arm64-v8a.apk"
          mkdir -p build/release-apk
          cp "$apk" "build/release-apk/${output}"
          ls -lah build/release-apk/*.apk

      - name: Create or update draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes_file="build/release-notes.md"
          source_sha="$(git rev-parse HEAD)"
          cat > "$notes_file" <<EOF
          Signed Android arm64 APK built from ${source_sha}.
          This Release is a draft and has not been published.
          EOF
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes-file "$notes_file" --draft
            gh release upload "${RELEASE_TAG}" build/release-apk/*.apk --clobber
          else
            gh release create "${RELEASE_TAG}" build/release-apk/*.apk \
              --draft \
              --title "${RELEASE_TAG}" \
              --notes-file "$notes_file"
          fi
